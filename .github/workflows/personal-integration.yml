name: Personal Integration Guard

on:
  push:
    branches:
      - "integration/**"
      - "personal/**"
      - "topic/**"
  pull_request:
    branches:
      - "integration/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-guardrails:
    name: static guardrails
    runs-on: ${{ vars.HERMES_CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff enforcement
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Windows footgun checker
        run: |
          source .venv/bin/activate
          python scripts/check-windows-footguns.py --all

  cross-platform-smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"

      - name: Install smoke dependencies
        shell: bash
        run: |
          uv venv .venv --python 3.11
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          uv pip install -e ".[dev,cli,pty,mcp,web]"
          "$PY" -m hermes_cli.main --version
          "$PY" -m pytest tests/test_packaging_metadata.py -q --timeout-method=thread
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""

  node-surfaces:
    name: node surfaces
    runs-on: ${{ vars.HERMES_CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install workspace dependencies
        run: npm ci

      - name: Type-check TUI
        run: npm run type-check --workspace ui-tui

      - name: Build TUI
        run: npm run build --workspace ui-tui

      - name: Build hermes-ink package entry
        run: npm run build --workspace ui-tui/packages/hermes-ink

      - name: Test TUI
        run: npm test --workspace ui-tui

  full-python-tests:
    name: full python tests (${{ matrix.slice }}/6)
    runs-on: ${{ vars.HERMES_CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    needs:
      - static-guardrails
    strategy:
      fail-fast: false
      matrix:
        slice:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: personal-test-durations-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            personal-test-durations-${{ github.ref_name }}-
            personal-test-durations-
            test-durations

      - name: Install ripgrep
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run test slice
        run: |
          source .venv/bin/activate
          python scripts/run_tests_parallel.py --slice ${{ matrix.slice }}/6
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Upload per-slice durations
        if: always() && hashFiles('test_durations.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: personal-test-durations-slice-${{ matrix.slice }}
          path: test_durations.json
          retention-days: 1

  save-durations:
    name: save test durations
    runs-on: ${{ vars.HERMES_CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    needs: full-python-tests
    if: ${{ always() && needs.full-python-tests.result == 'success' }}
    steps:
      - name: Download all slice durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: personal-test-durations-slice-*
          path: durations
          merge-multiple: false

      - name: Merge into single durations file
        run: |
          python3 - <<'PY'
          import glob
          import json

          merged = {}
          for path in glob.glob("durations/**/test_durations.json", recursive=True):
              with open(path, encoding="utf-8") as handle:
                  merged.update(json.load(handle))
          with open("test_durations.json", "w", encoding="utf-8") as handle:
              json.dump(merged, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(f"Merged {len(merged)} file durations")
          PY

      - name: Save merged duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: personal-test-durations-${{ github.ref_name }}-${{ github.run_id }}

  e2e-tests:
    name: e2e tests
    runs-on: ${{ vars.HERMES_CI_UBUNTU_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs:
      - static-guardrails
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          NOUS_API_KEY: ""
